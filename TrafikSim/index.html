<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trafik Simülasyonu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="simulation-container">
            <canvas id="trafficCanvas"></canvas>
        </div>
        <div id="control-panel">
            <h2>Simülasyon Ayarları</h2>
            
            <div class="control-group">
                <label for="traffic-density">Trafik Yoğunluğu (%)</label>
                <input type="range" id="traffic-density" min="1" max="100" value="2" step="1">
                <span id="density-value">2%</span>
            </div>

            <div class="control-group">
                <label for="light-duration">Işık Süresi (sn)</label>
                <input type="range" id="light-duration" min="5" max="30" value="10" step="1">
                <span id="duration-value">10s</span>
            </div>

            <div class="control-group">
                <label for="car-speed">Araç Hız Çarpanı</label>
                <input type="range" id="car-speed" min="0.5" max="3" value="1" step="0.1">
                <span id="speed-value">1.0x</span>
            </div>

            <div class="control-group">
                <label for="car-acceleration">Hızlanma</label>
                <input type="range" id="car-acceleration" min="0.01" max="0.2" value="0.05" step="0.01">
                <span id="acceleration-value">0.05</span>
            </div>

            <div class="control-group">
                <label for="collision-distance">Çarpışma Mesafesi (px)</label>
                <input type="range" id="collision-distance" min="50" max="200" value="150" step="10">
                <span id="collision-value">150px</span>
            </div>

            <div class="control-group" style="border-top: 1px solid #555; padding-top: 10px; margin-top: 10px;">
                <label>Acil Durum Araçları</label>
                <p style="font-size: 12px; color: #aaa; margin: 5px 0;">Önce aracı seçin, sonra haritada şeride tıklayın.</p>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button onclick="prepareSpawnEmergencyVehicle('ambulance')" style="flex: 1; background-color: #e74c3c;">🚑 Ambulans</button>
                    <button onclick="prepareSpawnEmergencyVehicle('firetruck')" style="flex: 1; background-color: #d35400;">🚒 İtfaiye</button>
                    <button onclick="prepareSpawnEmergencyVehicle('police')" style="flex: 1; background-color: #3498db;">🚓 Polis</button>
                </div>
            </div>

            <div class="stats">
                <p>Araç Sayısı: <span id="car-count">0</span></p>
                <p>FPS: <span id="fps">0</span></p>
            </div>

            <button id="pause-btn">Duraklat</button>
            <button id="reset-btn">Sıfırla</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
